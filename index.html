<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Vector Globe</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="map"></div>
  <div id="panel">
    <h1>Departures from Hong Kong</h1>
    <div class="clock"><span id="clock">--:--</span><em id="date">&nbsp;</em></div>
    <p><span id="airborne">0</span> airborne &middot;
       <span id="departed">0</span> of <span id="total">0</span> departed</p>
    <div class="track"><div id="bar"></div></div>
    <button id="replay" hidden>Replay</button>
  </div>
  <div id="detail" hidden>
    <h2><span id="detail-callsign">&nbsp;</span> <em>to</em> <span id="detail-dest"></span></h2>
    <dl>
      <div><dt class="arc">Great circle</dt><dd id="detail-direct"></dd></div>
      <div><dt class="flown">Flown</dt><dd id="detail-flown"></dd></div>
      <div><dt>Detour</dt><dd id="detail-extra"></dd></div>
    </dl>
    <p id="detail-departed"></p>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
